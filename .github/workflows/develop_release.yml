name: Release to develop

on:
  push:
    branches:
      - develop
permissions:
  contents: write

jobs:
  build:
    name: Release to develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v6.3.0
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Maven Build
        run: |
          pip install requests beautifulsoup4
          cd droid-help
          python generate_search_index.py
          cd ..
          mvn -V -B package -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          python .github/scripts/generate_develop_release.py

        env:
          AWS_REGION: eu-west-2
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
